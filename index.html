<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Our Memories — 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <main id="homePage" class="page active">

    <section class="hero">
      <div class="hero-decoration">♡</div>

      <p class="small-title">OUR MEMORIES</p>

      <h1>2026</h1>

      <p class="hero-description">
        A little place to keep<br>
        all our precious memories ♡
      </p>
    </section>


    <section class="category-container">

      <!-- EVENT -->
      <button class="category-card event-card" onclick="openPage('eventPage')">

        <div class="category-number">01</div>

        <div class="category-info">
          <span class="category-label">EVENT</span>
          <h2>Our Events</h2>
          <p>Moments we shared together</p>
        </div>

        <span class="arrow">→</span>

      </button>


      <!-- MESSAGE -->
      <button class="category-card message-card" onclick="openPage('messagePage')">

        <div class="category-number">02</div>

        <div class="category-info">
          <span class="category-label">MESSAGE</span>
          <h2>Messages</h2>
          <p>Words from everyone ♡</p>
        </div>

        <span class="arrow">→</span>

      </button>

    </section>

    <footer>
      Made with love ♡ 2026
    </footer>

  </main>


  <!-- EVENT PAGE -->
  <main id="eventPage" class="page">

    <header class="subpage-header">
      <button class="back-button" onclick="openPage('homePage')">
        ← Back
      </button>

      <div>
        <span class="category-label">2026</span>
        <h1>Our Events</h1>
      </div>
    </header>


    <section class="event-list">

      <!-- EVENT 1 -->
      <button class="event-item" onclick="openEvent('event1')">

        <div class="event-cover">
          <span>EVENT 01</span>
        </div>

        <div class="event-text">
          <h2>Event Name</h2>
          <p>2026.00.00</p>
        </div>

        <span class="arrow">→</span>

      </button>


      <!-- EVENT 2 -->
      <button class="event-item" onclick="openEvent('event2')">

        <div class="event-cover cover-two">
          <span>EVENT 02</span>
        </div>

        <div class="event-text">
          <h2>Event Name</h2>
          <p>2026.00.00</p>
        </div>

        <span class="arrow">→</span>

      </button>

    </section>

  </main>


  <!-- EVENT DETAIL PAGE -->
  <main id="eventDetailPage" class="page">

    <header class="subpage-header">

      <button class="back-button" onclick="openPage('eventPage')">
        ← Events
      </button>

      <div>
        <span class="category-label">EVENT</span>
        <h1 id="eventTitle">Event Name</h1>
      </div>

    </header>


    <section class="event-gallery" id="eventGallery">

      <!-- Images will appear here -->

    </section>

  </main>


  <!-- MESSAGE PAGE -->
  <main id="messagePage" class="page">

    <header class="subpage-header">

      <button class="back-button" onclick="openPage('homePage')">
        ← Back
      </button>

      <div>
        <span class="category-label">2026</span>
        <h1>Messages</h1>
      </div>

    </header>


    <!-- ADD MESSAGE BUTTON -->

    <section class="message-intro">

      <p>
        Leave a photo and a little message
        to keep in our memories ♡
      </p>

      <button class="post-button" onclick="openMessageForm()">
        + Leave a Message
      </button>

    </section>


    <!-- MESSAGES -->

    <section id="messageList" class="message-list">

      <!-- Messages will appear here -->

    </section>

  </main>


  <!-- MESSAGE FORM -->

  <div id="messageModal" class="modal">

    <div class="modal-box">

      <button class="close-button" onclick="closeMessageForm()">
        ×
      </button>

      <span class="category-label">LEAVE A MESSAGE</span>

      <h2>Share your memory ♡</h2>


      <!-- IMAGE -->

      <label class="upload-box">

        <input
          type="file"
          id="photoInput"
          accept="image/*"
          onchange="previewImage(event)"
        >

        <div id="uploadContent">

          <div class="upload-icon">＋</div>

          <strong>Upload your photo</strong>

          <span>Tap here to choose a photo</span>

        </div>

        <img id="imagePreview" class="image-preview">

      </label>


      <!-- NAME -->

      <label class="input-label">
        Your name

        <input
          type="text"
          id="nameInput"
          placeholder="Enter your name"
          maxlength="50"
        >

      </label>


      <!-- MESSAGE -->

      <label class="input-label">
        Your message

        <textarea
          id="messageInput"
          placeholder="Write something..."
          maxlength="500"
        ></textarea>

      </label>


      <button class="submit-button" onclick="submitMessage()">
        POST ♡
      </button>

    </div>

  </div>


  <!-- IMAGE VIEWER -->

  <div id="imageViewer" class="image-viewer" onclick="closeImageViewer()">

    <button class="viewer-close">×</button>

    <img id="viewerImage">

  </div>


  <script src="script.js"></script>

</body>
</html>
